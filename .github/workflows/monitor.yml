name: Token 中转站监控

on:
  schedule:
    - cron: '*/10 * * * *'       # 每10分钟
  workflow_dispatch:               # 允许手动触发

permissions:
  contents: write                  # 允许写入data/目录

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests pyyaml

      - name: 运行监控脚本
        run: python monitor.py

      - name: 提交更新数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "📊 监控数据更新 [$(date +'%Y-%m-%d %H:%M')]"
          git push

  daily-report:
    runs-on: ubuntu-latest
    needs: monitor
    if: github.event.schedule == '0 13 * * *'   # UTC 13:00 = 北京时间 21:00
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests pyyaml

      - name: 生成日报
        run: python daily_report.py
