# ==========================================
# Token 比价站自动化工作流 - 配置文件
# ==========================================

# 监控的中转站列表
stations:
  - name: OpenRouter
    url: https://openrouter.ai/api/v1/models
    type: 官转
    affiliate_link: ""
  - name: YesCode
    url: https://api.yescode.io/v1/models
    type: 官转
    affiliate_link: ""
  - name: oaipro
    url: https://api.oaipro.com/v1/models
    type: 官转
    affiliate_link: ""
  - name: Duck Code
    url: https://api.duckcode.com/v1/models
    type: 混合
    affiliate_link: ""
  - name: PackyCode
    url: https://api.packycode.com/v1/models
    type: 混合
    affiliate_link: ""
  - name: Privnode
    url: https://api.privnode.com/v1/models
    type: 混合
    affiliate_link: ""
  - name: Cubence
    url: https://api.cubence.com/v1/models
    type: 官转
    affiliate_link: ""

# 告警阈值
alerts:
  latency_warning_ms: 1000      # 延迟超 1000ms → 黄色预警
  latency_critical_ms: 3000     # 延迟超 3000ms → 红色告警
  downtime_minutes: 10          # 连续不可达超 10 分钟 → 告警
  consecutive_failures: 3       # 连续失败 3 次 → 告警

# 检测频率
monitor:
  interval_minutes: 10          # 每 10 分钟检测一次

# 每日报告推送时间
report:
  push_time: "21:00"            # 每晚 9 点推送
  push_method: feishu_doc       # feishu_doc | feishu_webhook | local_only

# 飞书配置
feishu:
  # 方式1：飞书文档（已可用）
  doc_folder: "Token比价站日报"
  # 方式2：飞书机器人 Webhook（可选，需在飞书群里添加机器人后填写）
  webhook_url: ""
